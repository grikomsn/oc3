name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write  # npm trusted publishing / provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm supports trusted publishing
        run: node -e "const v=require('node:child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim(); const [major,minor]=v.split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) throw new Error('npm 11.5.1 or newer is required, found '+v)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create or update version pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version
          commit: 'chore: version package'
          title: 'chore: version package'
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release version
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./npm/package.json').version")"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if ! npm view @nbrst/oc3 version >/dev/null 2>&1; then
            echo "::warning::Bootstrap @nbrst/oc3 on npm, configure its trusted publisher, then rerun this workflow."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          if npm view "@nbrst/oc3@${version}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate package
        if: steps.release.outputs.release == 'true' || steps.release.outputs.publish == 'true'
        run: bun run check

      - name: Build platform binaries
        if: steps.release.outputs.release == 'true' || steps.release.outputs.publish == 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          mkdir -p dist npm-dist
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun build ./src/cli.ts --compile --minify \
              --target="bun-${target}" \
              --outfile "dist/oc3-${target}" \
              --define "OC3_VERSION='\"${VERSION}\"'"
            tar -czf "dist/oc3-${VERSION}-${target}.tar.gz" -C dist "oc3-${target}"
            shasum -a 256 "dist/oc3-${VERSION}-${target}.tar.gz" >> dist/checksums.txt
          done
          rm -f dist/oc3-darwin-arm64 dist/oc3-darwin-x64 dist/oc3-linux-x64 dist/oc3-linux-arm64

      - name: Prepare npm platform packages
        if: steps.release.outputs.release == 'true' || steps.release.outputs.publish == 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            os="${target%%-*}"
            case "$target" in
              *-x64) arch="x64" ;;
              *) arch="arm64" ;;
            esac
            pkg_dir="npm-dist/@nbrst/oc3-${target}"
            mkdir -p "$pkg_dir/bin"
            cp "dist/oc3-${target}" "$pkg_dir/bin/oc3"
            sed -e "s/TEMPLATE/@nbrst\/oc3-${target}/" \
                -e "s/TEMPLATE_OS/${os}/" \
                -e "s/TEMPLATE_ARCH/${arch}/" \
                -e "s/0.0.1/${VERSION}/" \
                npm/platform/package.json > "$pkg_dir/package.json"
            cp LICENSE "$pkg_dir/LICENSE"
          done
          node -e "
            const pkg = require('./npm/package.json');
            pkg.version = process.env.VERSION;
            for (const dep of Object.keys(pkg.optionalDependencies)) pkg.optionalDependencies[dep] = process.env.VERSION;
            require('fs').writeFileSync('npm/package.json', JSON.stringify(pkg, null, 2) + '\\n');
          "

      - name: Publish to npm (trusted publishing + provenance)
        if: steps.release.outputs.publish == 'true'
        run: |
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            cd "npm-dist/@nbrst/oc3-${target}"
            npm publish --access public --provenance
            cd -
          done
          cd npm && npm publish --access public --provenance

      - name: Create GitHub release
        if: steps.release.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.release.outputs.tag }}" \
            --generate-notes \
            dist/oc3-*.tar.gz dist/checksums.txt
