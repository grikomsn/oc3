name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write  # npm trusted publishing / provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm supports trusted publishing
        run: node -e "const v=require('node:child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim(); const [major,minor,patch]=v.split('.').map(Number); const ok=major>11||(major===11&&(minor>5||(minor===5&&patch>=1))); if (!ok) throw new Error('npm 11.5.1 or newer is required, found '+v)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create or update version pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version
          commit-message: 'chore: version package'
          pr-title: 'chore: version package'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release version
        if: steps.changesets.outputs.has-changesets == 'false'
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./npm/package.json').version")"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if ! npm view @nbrst/oc3 version >/dev/null 2>&1; then
            echo "::warning::Bootstrap @nbrst/oc3 on npm, configure its trusted publisher, then rerun this workflow."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          if npm view "@nbrst/oc3@${version}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate package
        if: steps.release.outputs.release == 'true' || steps.release.outputs.publish == 'true'
        run: bun run check

      - name: Build platform binaries
        if: steps.release.outputs.release == 'true' || steps.release.outputs.publish == 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          mkdir -p dist npm-dist
          # bun skips foreign-platform optional deps; the compile embeds each
          # target's opentui native, so force-install all four before building.
          # --no-save keeps bun.lock untouched. npm is avoided here on purpose:
          # it cannot walk bun's isolated node_modules store, whose published
          # packages carry workspace:* devDeps (EUNSUPPORTEDPROTOCOL).
          bun install --no-save --os='*' --cpu='*'
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun build ./src/cli.ts --compile --minify \
              --target="bun-${target}" \
              --outfile "dist/oc3-${target}" \
              --define "OC3_VERSION='\"${VERSION}\"'"
            tar -czf "dist/oc3-${VERSION}-${target}.tar.gz" -C dist "oc3-${target}"
            shasum -a 256 "dist/oc3-${VERSION}-${target}.tar.gz" >> dist/checksums.txt
          done

      - name: Prepare npm platform packages
        if: steps.release.outputs.release == 'true' || steps.release.outputs.publish == 'true'
        run: |
          export VERSION="${{ steps.release.outputs.version }}"
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            os="${target%%-*}"
            case "$target" in
              *-x64) arch="x64" ;;
              *) arch="arm64" ;;
            esac
            pkg_dir="npm-dist/@nbrst/oc3-${target}"
            mkdir -p "$pkg_dir/bin"
            cp "dist/oc3-${target}" "$pkg_dir/bin/oc3"
            # Order matters: replace TEMPLATE_OS/TEMPLATE_ARCH first, then the
            # bare TEMPLATE (name + description) — otherwise the long tokens
            # get mangled by the shorter pattern.
            sed -e "s/TEMPLATE_OS/${os}/" \
                -e "s/TEMPLATE_ARCH/${arch}/" \
                -e "s/TEMPLATE/@nbrst\/oc3-${target}/" \
                -e "s/0.0.1/${VERSION}/" \
                npm/platform/package.json > "$pkg_dir/package.json"
            cp LICENSE "$pkg_dir/LICENSE"
          done
          node -e "
            const pkg = require('./npm/package.json');
            pkg.version = process.env.VERSION;
            for (const dep of Object.keys(pkg.optionalDependencies)) pkg.optionalDependencies[dep] = process.env.VERSION;
            require('fs').writeFileSync('npm/package.json', JSON.stringify(pkg, null, 2) + '\\n');
          "

      - name: Publish to npm (trusted publishing + provenance)
        if: steps.release.outputs.publish == 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            name="@nbrst/oc3-${target}"
            if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
              echo "skip ${name}@${VERSION}: already published"
            else
              ( cd "npm-dist/@nbrst/oc3-${target}" && npm publish --access public --provenance )
            fi
          done
          if npm view "@nbrst/oc3@${VERSION}" version >/dev/null 2>&1; then
            echo "skip @nbrst/oc3@${VERSION}: already published"
          else
            ( cd npm && npm publish --access public --provenance )
          fi

      - name: Create GitHub release
        if: steps.release.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.release.outputs.tag }}" \
            --generate-notes \
            dist/oc3-*.tar.gz dist/checksums.txt
